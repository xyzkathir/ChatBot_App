<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mashreq Banking Assistant</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark">M</div>
          <div>
            <p class="eyebrow">Customer Service</p>
            <h1>Mashreq Bank Assistant</h1>
          </div>
        </div>
      </header>

      <main class="chat-panel">
        <div id="chatBox" class="chat-box" aria-live="polite">
          <div class="message bot">
            <span class="message-label">Bank Assistant</span>
            <p>Hello! I can help with account support, card issues, payments, transfers, and general banking questions.</p>
          </div>
        </div>

        <form id="chatForm" class="chat-form">
          <label class="sr-only" for="messageInput">Type your message</label>
          <input
            id="messageInput"
            type="text"
            placeholder="Ask about your account, card, payment, or support..."
            autocomplete="off"
          />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
